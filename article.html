<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مُوكْرُو — مقال</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("mocro-theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t)}else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches){document.documentElement.setAttribute("data-theme","dark")}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>
<a href="#main" class="skip-link">تخطّى إلى المحتوى</a>
<header class="mocro-header" id="top">
  <div class="masthead">
    <div class="container masthead-inner">
      <a href="index.html" class="brand" aria-label="مُوكْرُو — الصفحة الرئيسية">مُوكْرُو</a>
      <nav class="nav-desktop" aria-label="التنقل الرئيسي">
        <a href="index.html#latest" class="nav-link">الأحدث</a>
        <div class="nav-item has-sub">
          <button class="nav-link nav-trigger" aria-haspopup="true" aria-expanded="false">الأقسام <span class="material-symbols-outlined nav-caret" aria-hidden="true">expand_more</span></button>
          <div class="submenu" role="menu" id="nav-categories-desktop"></div>
        </div>
        <a href="index.html#journal" class="nav-link">مقالات</a>
      </nav>
      <div class="masthead-actions">
        <button class="search-btn" data-search-toggle aria-label="فتح البحث"><span class="material-symbols-outlined" aria-hidden="true">search</span></button>
        <button class="theme-toggle" data-theme-toggle aria-label="تبديل الوضع الليلي/النهاري" aria-pressed="false"><span class="material-symbols-outlined icon-moon" aria-hidden="true">dark_mode</span><span class="material-symbols-outlined icon-sun" aria-hidden="true">light_mode</span></button>
        <button class="burger" data-burger aria-label="فتح القائمة" aria-expanded="false" aria-controls="mobile-menu"><span></span></button>
      </div>
    </div>
    <nav class="mobile-menu" id="mobile-menu" aria-label="قائمة الجوال" aria-hidden="true">
      <a href="index.html#latest"><span>الأحدث</span><span class="material-symbols-outlined menu-arrow" aria-hidden="true">arrow_back</span></a>
      <a href="index.html#journal"><span>مقالات</span><span class="material-symbols-outlined menu-arrow" aria-hidden="true">arrow_back</span></a>
    </nav>
  </div>
</header>

<div class="search-overlay" id="search-overlay" aria-hidden="true">
  <div class="search-panel">
    <button class="search-close" data-search-close aria-label="إغلاق البحث"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
    <h2 class="search-title">ابحث في مُوكْرُو</h2>
    <input type="search" class="search-input" id="search-input" placeholder="اكتب كلمة مثل: سياسة، اقتصاد، رياضة…" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
</div>
<main id="main">
  <article id="article-root">
    <div class="article-hero container"><div class="article-hero-media skeleton"></div></div>
    <div class="container article-head"><h1 class="skeleton" style="height:2.5rem;width:70%"></h1></div>
    <div class="container article-body"><div class="article-content"><div class="skeleton" style="height:1rem;margin:1rem 0"></div><div class="skeleton" style="height:1rem;margin:1rem 0"></div><div class="skeleton" style="height:1rem;margin:1rem 0;width:80%"></div></div></div>
  </article>
  <section class="related-section container" id="related"><h2 class="section-title">مقالات ذات صلة</h2><div class="related-grid" id="related-grid"></div></section>
</main>
<footer class="mocro-footer">
  <div class="container">
    <div class="footer-grid">
      <div><div class="footer-brand">مُوكْرُو</div><p class="footer-brand-desc">منصة أخبار عربية تغطي الأحداث المحلية والعالمية بمهنية وموضوعية.</p></div>
      <div><h4>الأقسام</h4><div id="footer-categories"></div></div>
      <div><h4>المصادر</h4><a href="https://github.com/vakelior/mocro">المستودع على GitHub</a><a href="admin.html">لوحة التحكم</a></div>
    </div>
    <div class="footer-bottom"><span>© 2026 مُوكْرُو. جميع الحقوق محفوظة.</span><span class="mono">Black &amp; White · 2026</span></div>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/shared.js"></script>
<script src="assets/js/article.js"></script>
</body>
</html>
